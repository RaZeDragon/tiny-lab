name: QA on emulator

on:
  push:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch the Fredoka font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/fredoka.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || true

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p qa-out
          { echo "cpus: $(nproc)"; free -m; ls -la /dev/kvm || echo "NO KVM"; } > qa-out/machine.txt
          cat qa-out/machine.txt

      # A booted emulator saved as a snapshot, so later runs start in seconds instead of minutes
      - name: Restore the saved emulator
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29-pixel6-v3

      - name: Boot the emulator once and save it
        id: save1
        continue-on-error: true
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          emulator-boot-timeout: 600
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Saved the emulator snapshot."

      - name: Boot the emulator once and save it (second try)
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.save1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          emulator-boot-timeout: 600
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Saved the emulator snapshot."

      - name: Play the game on an emulator
        id: play1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          emulator-boot-timeout: 600
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p qa-out
            adb wait-for-device; adb devices > qa-out/adb.txt 2>&1; adb shell getprop sys.boot_completed >> qa-out/adb.txt 2>&1 || true
            for i in 1 2 3 4; do adb install -r app/build/outputs/apk/debug/app-debug.apk >> qa-out/install.txt 2>&1 && break; sleep 15; done
            python3 qa/run_qa.py 2>&1 | tee qa-out/console.txt

      - name: Play the game on an emulator (second try if it didn't boot)
        if: steps.play1.outcome == 'failure' && hashFiles('qa-out/report.md') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          emulator-boot-timeout: 600
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p qa-out
            adb wait-for-device; adb devices > qa-out/adb.txt 2>&1; adb shell getprop sys.boot_completed >> qa-out/adb.txt 2>&1 || true
            for i in 1 2 3 4; do adb install -r app/build/outputs/apk/debug/app-debug.apk >> qa-out/install.txt 2>&1 && break; sleep 15; done
            python3 qa/run_qa.py 2>&1 | tee qa-out/console.txt

      - name: Publish results to the qa-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r qa-out/* /tmp/results/ 2>/dev/null || echo "no results" > /tmp/results/report.md
          cd /tmp/results
          git init -q && git checkout -q -b qa-results
          git config user.name "qa-bot" && git config user.email "qa-bot@users.noreply.github.com"
          git add -A && git commit -qm "QA results for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-results
