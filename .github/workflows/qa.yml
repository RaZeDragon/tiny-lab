name: QA on emulator

on:
  push:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch the Fredoka font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/fredoka.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || true

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p qa-out
          { echo "cpus: $(nproc)"; free -m; ls -la /dev/kvm || echo "NO KVM"; } > qa-out/machine.txt
          cat qa-out/machine.txt

      - name: Play the game on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 qa/run_qa.py 2>&1 | tee qa-out/console.txt

      - name: Publish results to the qa-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r qa-out/* /tmp/results/ 2>/dev/null || echo "no results" > /tmp/results/report.md
          cd /tmp/results
          git init -q && git checkout -q -b qa-results
          git config user.name "qa-bot" && git config user.email "qa-bot@users.noreply.github.com"
          git add -A && git commit -qm "QA results for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-results
