name: QA screenshots

# Runs the real game code on the build machine (Robolectric, no emulator) and saves screenshots.
on:
  push:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch the Fredoka font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/fredoka.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || true

      - name: Run the screenshot tests
        run: gradle testDebugUnitTest --no-daemon --continue

      - name: Publish results to the qa-results branch
        if: always()
        run: |
          mkdir -p /tmp/results
          cp -r app/build/qa-shots/* /tmp/results/ 2>/dev/null || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          lines = ["# Screenshot test results", ""]
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              for tc in r.iter("testcase"):
                  fail = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                  lines.append(("- FAIL " if fail is not None else "- ok   ") + tc.get("name") + " (" + tc.get("time") + "s)")
                  if fail is not None:
                      lines.append("```\n" + (fail.get("message") or "") + "\n" + (fail.text or "")[:3000] + "\n```")
          if len(lines) == 2:
              lines.append("No test results: the tests did not compile or run.")
          open("/tmp/results/report.md", "w").write("\n".join(lines) + "\n")
          PY
          cp app/build/reports/tests/testDebugUnitTest/index.html /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q && git checkout -q -b qa-results
          git config user.name "qa-bot" && git config user.email "qa-bot@users.noreply.github.com"
          git add -A && git commit -qm "QA screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-results
